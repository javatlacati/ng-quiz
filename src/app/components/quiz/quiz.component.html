<div class="quiz">
  <ng-container>
    <mat-card appearance="outlined">
      <app-quiz-question-header [currentQuestionAlv]="currentQuestionAlv()"></app-quiz-question-header>
      <app-quiz-question-form [formRoot]="quizForm" [currentQuestionAlv]="currentQuestionAlv()"
                              [mulAnswerSelectionChanged]="(event) => onFormChange(event)"
                              [currentQuestionOptions]="currentQuestionOptions()"
      >
        @if (this.questionsData().length === (this.currentQuestionIndex() + 1 || 0)) {
          <button id="goToResultsButton" [disabled]="!completedQuiz()"
                  (click)="goToResults()">{{ 'quiz.goToResults'|translate }}
          </button>
        }
      </app-quiz-question-form>
      <mat-paginator [length]="questionsData().length"
                     [pageSize]="1"
                     (page)="handleQuestionChange($event)"
                     aria-label="Select question" hidePageSize="true" showFirstLastButtons="true">
      </mat-paginator>
    </mat-card>
    <mat-card appearance="filled">
      {{ 'quiz.page'|translate }} {{ currentQuestionIndex() }} {{ 'quiz.of'|translate }} {{ questionsData().length }}
<!--      {{ 'quiz.currentQuestion'|translate }} {{ JSON.stringify(currentQuestionAlv()) }}-->
    </mat-card>
  </ng-container>
</div>
